<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="video" content="1080x1920@30/25">
<title>約好 Reels：三分鐘開好預約頁</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="reel.css">
</head>
<body>
<div id="stage">

  <!-- 1 問題 -->
  <section class="scene on-blue" style="--at:0s; --len:4s">
    <h1 class="h1 serif" style="top:330px; font-size:136px">開一個<br>預約頁，<br>要多久？</h1>
    <div class="abs" style="left:130px; top:1010px"><span class="serif a pop" style="display:inline-block; font-size:230px; line-height:1.1; transform-origin:left bottom; --t:1.5s; --d:.45s"><span class="mark" style="--t:1.75s">三分鐘</span></span></div>
    <p class="abs a rise" style="left:130px; top:1330px; font-size:54px; color:rgb(255 255 255 / .82); --t:2.3s">用手機就能做完。跟著做一次：</p>
  </section>

  <!-- 2 一步一步 -->
  <section class="scene enter-up" style="--at:3.6s; --len:17.8s; background:var(--paper)">
    <div class="a shake" style="position:absolute; inset:0; --t:18.42s">
      <div class="cap time" style="--t:3.9s; --d:2.9s"><span class="n">0:20</span><p class="l serif">註冊</p><p class="s">Email 和密碼，不用綁卡</p></div>
      <div class="cap time" style="--t:6.8s; --d:3s"><span class="n">0:50</span><p class="l serif">填店名、選行業</p><p class="s">順便取一個自己的網址</p></div>
      <div class="cap time" style="--t:9.8s; --d:2.8s"><span class="n">1:10</span><p class="l serif">預約頁開好了</p><p class="s">馬上有一條可以分享的連結</p></div>
      <div class="cap time" style="--t:12.6s; --d:2.8s"><span class="n">1:40</span><p class="l serif">價目先幫你列好</p><p class="s">依行業建好常見服務，改一改就能用</p></div>
      <div class="cap time" style="--t:15.4s; --d:2.7s"><span class="n">2:30</span><p class="l serif">把連結貼出去</p><p class="s">IG、LINE，或印成 QR Code 放櫃檯</p></div>
      <div class="cap time" style="--t:18.1s; --d:3.4s"><span class="n">3:00</span><p class="l serif">開始收預約</p><p class="s">這就是客人看到的畫面</p></div>

      <div class="phone phone-settle" style="left:190px; top:640px; width:700px; height:1489px; --t:3.6s">
        <div class="screen">
          <div class="shot"><div class="cam" style="--mt:4.3s; --md:1.6s; --o:50% 30%; --to:translateY(-6%) scale(1.12)"><img src="assets/o-1-signup.png" alt=""></div></div>
          <div class="shot a fade" style="--t:6.8s; --d:.3s"><div class="cam" style="--mt:7.2s; --md:1.6s; --o:50% 30%; --to:translateY(-6%) scale(1.12)"><img src="assets/o-2-onboarding.png" alt=""></div></div>
          <div class="shot a fade" style="--t:9.8s; --d:.3s"><div class="cam" style="--mt:10.2s; --md:1.8s; --to:translateY(-7%)"><img src="assets/o-3-welcome.png" alt=""></div></div>
          <div class="shot a fade" style="--t:12.6s; --d:.3s"><div class="cam" style="--mt:13s; --md:1.8s; --to:translateY(-7%)"><img src="assets/o-4-services.png" alt=""></div></div>
          <div class="shot a fade" style="--t:15.4s; --d:.3s"><div class="cam" style="--mt:15.8s; --md:1.6s; --o:0% 25%; --to:translateY(-6%) scale(1.2)"><img src="assets/o-5-share.png" alt=""></div></div>
          <div class="shot a fade" style="--t:18.1s; --d:.3s"><img src="assets/o-6-page.png" alt=""></div>
          <i class="tap" style="left:339px; top:880px; --t:6.25s"></i>
          <i class="tap" style="left:339px; top:915px; --t:9.25s"></i>
        </div>
      </div>
      <div class="abs" style="left:0; right:0; top:1000px; text-align:center"><span class="stamp slam" style="font-size:210px; --t:18.2s">開好了</span></div>
    </div>
  </section>

  <!-- 3 結尾 -->
  <section class="scene ruled enter-up" style="--at:21.2s; --len:3.8s; --rule:120px; --margin:96px">
    <div class="abs" style="left:130px; top:330px"><span class="seal slam" style="font-size:210px; --rot:-4deg; --t:21.6s">約好</span></div>
    <p class="abs serif a rise" style="left:130px; top:770px; font-size:96px; line-height:1.3; --t:22s">美髮・美甲・教練的<br>線上預約本</p>
    <p class="abs a rise" style="left:130px; top:1090px; font-size:62px; font-weight:700; --t:22.4s">一個人的店，<span class="hl" style="--t:22.9s">免費用</span>。</p>
    <p class="cta a rise" style="top:1230px; --t:22.7s">免費開一個預約頁</p>
    <p class="abs a fade" style="left:130px; top:1420px; font-size:44px; color:var(--muted); --t:23.2s">連結在個人檔案</p>
  </section>

</div>
</body>
</html>
